<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Place finder</title>
    <style>
      :root {
        color-scheme: light;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #202b36;
        background: #f3f6f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 24px;
        scrollbar-gutter: stable;
      }
      main {
        width: min(100%, 620px);
        margin-block: clamp(24px, 8vh, 72px);
        padding: clamp(24px, 6vw, 48px);
        background: white;
        border: 1px solid #e1e7ec;
        border-radius: 18px;
        box-shadow: 0 16px 48px #1b34420d;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.7rem, 5vw, 2.2rem);
        letter-spacing: -0.03em;
      }
      p {
        color: #5d6b77;
      }
      label {
        display: block;
        margin: 24px 0 7px;
        font-weight: 650;
      }
      input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #b9c5ce;
        border-radius: 9px;
        font: inherit;
      }
      input:focus {
        outline: 3px solid #1976d233;
        border-color: #1976d2;
      }
      #status {
        min-height: 1.5em;
        margin: 12px 0 8px;
        color: #5d6b77;
      }
      ul {
        height: 300px;
        overflow-y: auto;
        list-style: none;
        margin: 0;
        padding: 0;
        scrollbar-gutter: stable;
      }
      li {
        padding: 12px 14px;
        border-top: 1px solid #e8edf0;
      }
      li strong {
        display: block;
      }
      li span {
        color: #687782;
        font-size: 0.92rem;
      }
      footer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid #e8edf0;
        color: #71808a;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Find a place</h1>
      <p>Start typing a place name to see matching locations.</p>
      <label for="query">Place name</label>
      <input
        id="query"
        type="search"
        autocomplete="off"
        placeholder="Try Berlin"
        aria-describedby="status"
      />
      <p id="status" role="status" aria-live="polite">Type to search.</p>
      <ul id="results" aria-label="Suggestions"></ul>
      <footer>
        Place data from <a href="https://www.geonames.org/">GeoNames</a>,
        licensed under
        <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
      </footer>
    </main>
    <script>
      const input = document.querySelector("#query");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");
      let timer;
      let activeRequest;
      let generation = 0;

      input.addEventListener("input", () => {
        clearTimeout(timer);
        activeRequest?.abort();
        const requestGeneration = ++generation;
        const query = input.value.trim();
        results.replaceChildren();
        if (!query) {
          status.textContent = "Type to search.";
          return;
        }
        status.textContent = "Waiting for input…";
        timer = setTimeout(() => search(query, requestGeneration), 125);
      });

      async function search(query, requestGeneration) {
        const controller = new AbortController();
        activeRequest = controller;
        status.textContent = "Searching…";
        try {
          const response = await fetch(
            `/suggest?q=${encodeURIComponent(query)}&limit=10`,
            { signal: controller.signal },
          );
          if (!response.ok)
            throw new Error(`Request failed (${response.status})`);
          const places = await response.json();
          if (requestGeneration !== generation) return;
          if (!places.length) {
            status.textContent = "No matching places found.";
            return;
          }
          status.textContent = `${places.length} suggestion${places.length === 1 ? "" : "s"}`;
          const items = places.map((place) => {
            const item = document.createElement("li");
            const name = document.createElement("strong");
            name.textContent = place.name;
            const detail = document.createElement("span");
            detail.textContent = place.country_code || "";
            item.append(name, detail);
            return item;
          });
          results.replaceChildren(...items);
        } catch (error) {
          if (error.name === "AbortError" || requestGeneration !== generation)
            return;
          status.textContent = "Could not load suggestions. Please try again.";
        }
      }
    </script>
  </body>
</html>
